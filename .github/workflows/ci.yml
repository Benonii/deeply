name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      CONVEX_URL: https://deeply-ci.convex.cloud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run build
      - name: Verify source excerpts are verbatim
        env:
          SRC_REF: ${{ runner.temp }}/src-ref
        run: |
          npm run fetch-sources
          npm run verify-code
          git diff --exit-code src/courses/convex/code/lines.json || (echo "lines.json is stale: run npm run verify-code and commit it" && exit 1)
